configuration:
  log_level:
    name: Log level
    description: Minimum severity for lifecycle messages. Use info to see startup and shutdown.
  status_interval_seconds:
    name: Status interval (seconds)
    description: How often the service reports its status, from 30 to 3600 seconds.
  retrigger_interval_seconds:
    name: Retrigger recovery interval (seconds)
    description: How often the separate recovery dispatcher checks interrupted or transiently failed work, from 30 to 3600 seconds.
  repo_b_candidate_transport:
    name: Repo B candidate transport
    description: Select token Git or the explicitly enrolled and verified deploy key for candidate detection and fetch.
  repo_b_publication_transport:
    name: Repo B snapshot publication transport
    description: Select token Git or the explicitly enrolled and verified deploy key for routine Local, database, runtime, and log snapshot publication.
  repo_b_promotion_transport:
    name: Repo B candidate promotion transport
    description: Select token Git or the explicitly enrolled and verified deploy key for publishing an observed candidate to main and its known-good tag.
  repo_b_rollback_transport:
    name: Repo B rollback proof transport
    description: Select token Git or the explicitly enrolled and verified deploy key for read-only rollback repository proof. Home Assistant backup restore remains Supervisor-authorized.
  recorder_database_path:
    name: Recorder database path
    description: Optional absolute path to the Recorder database below /homeassistant.
  recorder_retention_days:
    name: Recorder snapshot retention (days)
    description: Number of days to retain generated database snapshots, from 1 to 365.
  administrative_retry_request_id:
    name: Administrative retry request ID
    description: Optional new lowercase UUIDv4 identifying one explicit retry request. Configure all three administrative retry fields together.
  administrative_retry_work_kind:
    name: Administrative retry work kind
    description: Exact durable work kind for the one blocked item selected by this request.
  administrative_retry_work_key:
    name: Administrative retry work key
    description: Exact durable work key for the selected blocked item. This value is masked and never logged.
