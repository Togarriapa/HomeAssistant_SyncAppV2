name: Home Assistant SyncApp V2
version: "0.1.0"
slug: homeassistant_syncapp_v2
description: Experimental passive foundation for safe Home Assistant synchronization
url: https://github.com/Togarriapa/HomeAssistant_SyncAppV2
arch:
  - aarch64
  - amd64
startup: application
boot: manual
stage: experimental
init: true
apparmor: true
backup: cold
timeout: 15
options:
  log_level: info
  status_interval_seconds: 300
schema:
  log_level: list(info|warning|error)
  status_interval_seconds: int(30,3600)
  repo_b: str?
  github_token: password?
