name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r syncapp/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff format --check --diff .
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m bandit -q -r syncapp/src
      - run: python -m pytest -q

  container:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build app image
        run: docker build --build-arg BUILD_ARCH=${{ matrix.arch }} -t syncapp:test syncapp
      - name: Verify passive lifecycle and restart persistence
        run: python3 scripts/container_smoke.py
      - name: Verify isolated semantic sandbox boundaries
        run: python3 scripts/semantic_container_smoke.py semantic_sandbox_image_check.py
      - name: Verify exact-version Core semantic checker
        run: python3 scripts/semantic_container_smoke.py
