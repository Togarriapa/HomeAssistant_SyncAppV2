name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r syncapp/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - name: Run mypy with temporary diagnostics
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python -m mypy 2>&1 | tee /tmp/mypy-output.txt
          status=${PIPESTATUS[0]}
          cat /tmp/mypy-output.txt >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          lines = Path("/tmp/mypy-output.txt").read_text(encoding="utf-8").splitlines()
          first = next((line for line in lines if line.strip()), "mypy failed")[:140]
          Path("/tmp/status.json").write_text(
              json.dumps({"state": "error", "context": "diagnostic/mypy", "description": first}),
              encoding="utf-8",
          )
          PY
            curl --fail --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary @/tmp/status.json \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              >/dev/null
          fi
          exit "$status"
      - run: python -m bandit -q -r syncapp/src
      - run: python -m pytest -q

  container:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build app image
        run: docker build --build-arg BUILD_ARCH=${{ matrix.arch }} -t syncapp:test syncapp
      - name: Verify passive lifecycle and restart persistence
        run: python3 scripts/container_smoke.py
