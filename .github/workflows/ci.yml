name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r syncapp/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff format --check --diff .
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m bandit -q -r syncapp/src
      - run: python -m pytest -q

  container:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build app image
        run: docker build --build-arg BUILD_ARCH=${{ matrix.arch }} -t syncapp:test syncapp
      - name: Load and verify Supervisor-adjusted AppArmor profile
        run: |
          test -x /usr/sbin/apparmor_parser
          python3 scripts/apparmor_ci.py load
          sudo grep -Fxq "ci_homeassistant_syncapp_v2 (enforce)" /sys/kernel/security/apparmor/profiles
          sudo grep -Fxq "ci_homeassistant_syncapp_v2//validator (enforce)" /sys/kernel/security/apparmor/profiles
      - name: Verify passive lifecycle and restart persistence
        run: python3 scripts/container_smoke.py
      - name: Verify semantic validator AppArmor transition
        run: python3 scripts/semantic_container_smoke.py semantic_sandbox_image_check.py profile
      - name: Verify semantic sandbox entry
        run: python3 scripts/semantic_container_smoke.py semantic_sandbox_image_check.py sandbox-entry
      - name: Verify semantic sandbox identity boundary
        run: python3 scripts/semantic_container_smoke.py semantic_sandbox_image_check.py identity
      - name: Verify semantic sandbox image marker
        run: python3 scripts/semantic_container_smoke.py semantic_sandbox_image_check.py image-marker
      - name: Verify semantic sandbox filesystem boundary
        run: python3 scripts/semantic_container_smoke.py semantic_sandbox_image_check.py filesystem
      - name: Verify semantic sandbox network boundary
        run: python3 scripts/semantic_container_smoke.py semantic_sandbox_image_check.py network
      - name: Verify semantic sandbox executable boundary
        run: python3 scripts/semantic_container_smoke.py semantic_sandbox_image_check.py exec
      - name: Verify semantic sandbox runtime and workspace boundary
        run: python3 scripts/semantic_container_smoke.py semantic_sandbox_image_check.py runtime-workspace
      - name: Verify exact-version Core valid fixture
        run: python3 scripts/semantic_container_smoke.py semantic_image_check.py valid
      - name: Collect validator diagnostics for public fixture
        if: failure()
        run: |
          mkdir -p validator-diagnostics
          sudo journalctl -k --since "-2 minutes" --no-pager \
            | grep -E 'apparmor="DENIED".*profile="ci_homeassistant_syncapp_v2//validator"' \
            > validator-diagnostics/apparmor-denials.txt || true
          python3 scripts/semantic_container_smoke.py core_fixture_probe.py \
            > validator-diagnostics/core-fixture-probe.txt 2>&1 || true
      - name: Upload validator diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validator-diagnostics-${{ matrix.arch }}
          path: validator-diagnostics/
          if-no-files-found: error
          retention-days: 1
      - name: Verify exact-version Core invalid fixture rejection
        run: python3 scripts/semantic_container_smoke.py semantic_image_check.py invalid
      - name: Verify exact-version Core warning rejection
        run: python3 scripts/semantic_container_smoke.py semantic_image_check.py warning
      - name: Verify exact-version Core version binding
        run: python3 scripts/semantic_container_smoke.py semantic_image_check.py version
      - name: Unload AppArmor test profile
        if: always()
        run: python3 scripts/apparmor_ci.py unload
